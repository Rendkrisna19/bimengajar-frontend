<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full Frame Rounded Rect for Maximum Browser Favicon Fill -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#3B82F6" stroke-width="12" stroke-opacity="0.5" />

  <!-- Pyramid / Crest Shape -->
  <path d="M 256 60 L 436 330 L 76 330 Z" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Handshake Graphic -->
  <path d="M 210 155 C 220 142 240 142 248 152 L 256 160 L 264 152 C 272 142 292 142 302 155 L 316 175 C 322 183 316 195 304 195 L 208 195 C 196 195 190 183 196 175 Z" fill="#FFFFFF" />

  <!-- Open Book Graphic -->
  <path d="M 170 215 C 212 203 256 220 256 220 C 256 220 300 203 342 215 L 342 268 C 300 256 256 273 256 273 C 256 273 212 256 170 268 Z" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="256" y1="220" x2="256" y2="273" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />

  <!-- PLAT-BK Bold Banner Text -->
  <rect x="76" y="360" width="360" height="96" rx="24" fill="#FFFFFF" />
  <text x="256" y="432" text-anchor="middle" fill="#003366" font-family="system-ui, -apple-system, Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="1">PLAT-BK</text>
</svg>
